[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "python-intelbras-solar-local"
version = "0.3.2"
description = "Async Python client for Intelbras solar inverters (Sungrow WiNet-S) over Modbus TCP and the datalogger WebSocket"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Hudson Brendon", email = "contato.hudsonbrendon@gmail.com"}]
keywords = ["intelbras", "sungrow", "winet", "solar", "inverter", "modbus", "home-assistant", "async", "aiohttp"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: AsyncIO",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries",
]
dependencies = ["aiohttp>=3.9"]

[project.urls]
Homepage = "https://github.com/hudsonbrendon/python-intelbras-solar-local"
Documentation = "https://hudsonbrendon.github.io/python-intelbras-solar-local/"
Issues = "https://github.com/hudsonbrendon/python-intelbras-solar-local/issues"

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23", "ruff"]
docs = ["mkdocs-material>=9.5", "mkdocstrings[python]>=0.25"]

[tool.hatch.build.targets.wheel]
packages = ["src/intelbras_solar_local"]

[tool.ruff]
target-version = "py311"
line-length = 88
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
